<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Angel Filter</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2032;
    --ink: #e8ecf5;
    --muted: #93a0b8;
    --accent: #6aa9ff;
    --warn: #ffb36a;
    --good: #7dd87a;
    --border: #2a3450;
    --best-border: #6aa9ff44;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-bottom: 28px; }
  form { display: grid; gap: 10px; margin-bottom: 24px; }
  input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; width: 100%; }
  input:focus { outline: 2px solid var(--accent); }
  button.primary { font: inherit; color: #081020; background: var(--accent); border: none; border-radius: 10px; font-weight: 600; cursor: pointer; padding: 12px 18px; }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.5; cursor: wait; }
  .label { color: var(--muted); font-size: 13px; margin-bottom: -4px; }
  .meta { color: var(--muted); font-size: 13px; margin: 16px 0 10px; }
  .intent-badge { display: inline-block; background: #1e2d50; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-left: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .best-card { background: var(--card); border: 1px solid var(--best-border); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
  .best-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .best-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .best-snippet { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .consensus-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .consensus-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .axis-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .axis-chip { font-size: 12px; background: #202840; border-radius: 8px; padding: 4px 10px; }
  .axis-chip span { color: var(--accent); font-weight: 600; }
  .score-bar-wrap { margin: 10px 0 6px; }
  .score-bar-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .score-bar-track { background: #202840; border-radius: 999px; height: 6px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  .toggle-btn { background: none; border: 1px solid var(--border); color: var(--muted); font: inherit; font-size: 13px; border-radius: 8px; padding: 6px 14px; cursor: pointer; margin-bottom: 12px; }
  .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .others { display: none; }
  .others.open { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 8px; }
  .rank { display: inline-block; background: #2a3450; color: var(--accent); font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 8px; font-size: 13px; }
  .card-title { font-weight: 600; }
  .snippet { color: var(--muted); margin-top: 5px; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12px; }
  .chip { background: #202840; color: var(--muted); border-radius: 999px; padding: 3px 10px; }
  .chip.sponsored { background: #3a2a1a; color: var(--warn); }
  .chip.good { background: #1a3a22; color: var(--good); }
  .chip.agreed { background: #1a2e3a; color: #6ad4ff; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .error { color: var(--warn); }
  .history-wrap { position: relative; margin-bottom: 8px; }
  .history-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; z-index: 100; overflow: hidden; box-shadow: 0 8px 24px #00000055; }
  .history-dropdown.open { display: block; }
  .history-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: #202840; color: var(--ink); }
  .history-item-text { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-cache-badge { font-size: 11px; color: var(--good); margin-left: 8px; flex-shrink: 0; }
  .cache-badge { display: inline-block; background: #1a3a22; color: var(--good); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
  .provider-breakdown { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .provider-pill { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
  .provider-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .provider-count { color: var(--muted); }
  .viz-section { margin-top: 36px; }
  .viz-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .viz-tab { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .viz-tab:hover { color: var(--ink); }
  .viz-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .viz-panel { display: none; }
  .viz-panel.active { display: block; }
  .viz-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  #plot-3d { width: 100%; height: 640px; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--border); opacity: 0; transition: opacity 0.5s ease; }
  #plot-3d.loaded { opacity: 1; }
  #plot-radar { width: 100%; height: 420px; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
  .viz-unavailable { color: var(--muted); font-size: 13px; margin-top: 8px; }
  @media (max-width: 720px) {
    main { padding: 28px 16px; }
    #plot-3d { height: 420px; }
    #plot-radar { height: 320px; }
  }
</style>
</head>
<body>
<main>
  <h1>Angel Filter</h1>
  <p class="sub">Asks multiple AI providers, finds what they agree on, ranks by what <em>you</em> care about.</p>

  <form id="f">
    <span class="label">What are you looking for?</span>
    <div class="history-wrap">
      <input id="q" placeholder='e.g. "find three top lunch spots, budget $15"' required autocomplete="off" />
      <div id="history-dropdown" class="history-dropdown"></div>
    </div>
    <span class="label">What matters most to you? (optional)</span>
    <input id="p" placeholder='e.g. "low price" or "closest to me" or "highest rated"' />
    <div style="display:flex;gap:10px">
      <button id="go" class="primary" type="submit" style="flex:1">Ask Angel Filter</button>
      <button type="button" class="toggle-btn" onclick="toggleHistory()" style="white-space:nowrap">Recent queries</button>
    </div>
  </form>

  <div id="out"></div>

  <div id="viz-wrap" style="display:none" class="viz-section">
    <div class="viz-tabs">
      <button class="viz-tab active" onclick="switchTab('3d', this)" type="button">3D Scoring Space</button>
      <button class="viz-tab" onclick="switchTab('radar', this)" type="button">Radar Chart</button>
    </div>
    <div id="panel-3d" class="viz-panel active">
      <div class="viz-title">Price · Distance · Rating - winner is the red diamond, lines connect back to query origin</div>
      <div id="plot-3d"></div>
    </div>
    <div id="panel-radar" class="viz-panel">
      <div class="viz-title">Top 3 results compared across all three axes</div>
      <div id="plot-radar"></div>
    </div>
    <div id="viz-message" class="viz-unavailable" style="display:none"></div>
  </div>
</main>

<script src="/static/plotly.min.js"></script>
<script>
const form = document.getElementById("f");
const out = document.getElementById("out");
const btn = document.getElementById("go");
const vizWrap = document.getElementById("viz-wrap");
const vizMessage = document.getElementById("viz-message");

const PROVIDER_COLORS = {
  gemini: "#0f766e",
  ollama: "#b45309",
  openai: "#10a37f",
  watsonx: "#0f62fe",
  duckduckgo: "#2563eb",
  brave: "#e05c2a",
  mock: "#7c3aed",
};

let _maxScore = 1;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = document.getElementById("q").value.trim();
  const preference = document.getElementById("p").value.trim() || null;
  if (!query) return;

  btn.disabled = true;
  vizWrap.style.display = "none";
  vizMessage.style.display = "none";
  document.getElementById("plot-3d").classList.remove("loaded");
  out.innerHTML = `<div class="meta">Querying providers...</div>`;

  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ query, preference }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    _maxScore = Math.max(...(data.results || []).map((r) => r.score), 1);
    render(data);

    if ((data.results || []).length > 0) {
      renderVisuals(data.results);
    }
  } catch (err) {
    out.innerHTML = `<div class="card error">Request failed: ${esc(err.message || err)}</div>`;
  } finally {
    btn.disabled = false;
  }
});

function renderVisuals(results) {
  vizWrap.style.display = "block";

  if (!window.Plotly) {
    vizMessage.textContent = "Visualizations are unavailable because Plotly did not load, but the ranked results are still shown above.";
    vizMessage.style.display = "block";
    return;
  }

  render3D(results);
  renderRadar(results.slice(0, 3));
  setTimeout(() => {
    document.getElementById("plot-3d").classList.add("loaded");
    autoRotate();
  }, 100);
}

function autoRotate() {
  const el = document.getElementById("plot-3d");
  if (!window.Plotly || !el._layout) return;

  let angle = 0;
  const steps = 80;
  const id = setInterval(() => {
    angle += (2 * Math.PI) / steps;
    Plotly.relayout("plot-3d", {
      "scene.camera.eye": {
        x: 1.6 * Math.cos(angle),
        y: 1.6 * Math.sin(angle),
        z: 1.2,
      },
    });
    if (++el._rotateStep >= steps) clearInterval(id);
  }, 50);
  el._rotateStep = 0;
}

function render(data) {
  const results = data.results || [];
  const used = (data.providers_used || []).join(", ") || "none";
  const failed = (data.providers_failed || []).join(", ");
  const intent = data.intent || "general";

  const providerCounts = {};
  results.forEach((r) => {
    providerCounts[r.provider] = (providerCounts[r.provider] || 0) + 1;
  });

  const breakdownHtml = Object.entries(providerCounts).map(([provider, count]) => `
    <div class="provider-pill">
      <div class="provider-dot" style="background:${PROVIDER_COLORS[provider] || "#6aa9ff"}"></div>
      <span>${esc(provider)}</span>
      <span class="provider-count">${count} result${count > 1 ? "s" : ""}</span>
    </div>`).join("");

  let html = `
    <div class="meta">
      Providers: ${esc(used)}${failed ? " · failed: " + esc(failed) : ""}
      <span class="intent-badge">${esc(intent)}</span>
      ${data.cached ? `<span class="cache-badge">from cache</span>` : ""}
    </div>
    <div class="provider-breakdown">${breakdownHtml}</div>`;

  if (!results.length) {
    html += `<div class="card">No results returned.</div>`;
    out.innerHTML = html;
    return;
  }

  const best = results[0];
  const axes = best.axis_scores || {};
  const axisHtml = Object.entries(axes).map(([key, value]) =>
    `<div class="axis-chip">${esc(key.replace("_", " "))}: <span>${esc(String(value))}</span></div>`
  ).join("");

  html += `<div class="best-card">
    <div class="best-label">Angel Filter's best answer</div>
    <div class="best-title">${esc(best.title)}</div>
    <div class="best-snippet">${esc(best.snippet || "")}</div>
    ${best.url ? `<div class="best-snippet"><a href="${esc(best.url)}" target="_blank" rel="noopener">${esc(best.url)}</a></div>` : ""}
    ${(best.consensus_count || 0) > 1 ? `<div class="consensus-bar"><div class="consensus-dot"></div>${esc(String(best.consensus_count))} providers agreed on this answer</div>` : ""}
    <div class="axis-row">${axisHtml}</div>
    ${scoreBar(best.score, "#dc2626")}
    <div class="row">
      <span class="chip">score ${esc(String(best.score))}</span>
      <span class="chip" style="background:${PROVIDER_COLORS[best.provider] || "#202840"}22;color:${PROVIDER_COLORS[best.provider] || "var(--muted)"}">${esc(best.provider)}</span>
      ${best.sponsored ? `<span class="chip sponsored">sponsored · penalized</span>` : `<span class="chip good">organic</span>`}
      ${(best.consensus_count || 0) > 1 ? `<span class="chip agreed">${esc(String(best.consensus_count))} agreed</span>` : ""}
    </div>
    <div class="snippet" style="margin-top:8px"><em>${esc(best.rationale || "")}</em></div>
  </div>`;

  if (results.length > 1) {
    html += `<button class="toggle-btn" onclick="toggleOthers(this)" type="button">Show other responses (${results.length - 1})</button><div class="others" id="others">`;

    results.slice(1).forEach((result, index) => {
      const providerColor = PROVIDER_COLORS[result.provider] || "#6aa9ff";
      html += `<div class="card">
        <span class="rank">#${index + 2}</span>
        <span class="card-title">${esc(result.title)}</span>
        ${result.sponsored ? `<span class="chip sponsored" style="font-size:11px;margin-left:6px">sponsored</span>` : ""}
        <div class="snippet">${esc(result.snippet || "")}</div>
        ${result.url ? `<div class="snippet"><a href="${esc(result.url)}" target="_blank" rel="noopener">${esc(result.url)}</a></div>` : ""}
        ${scoreBar(result.score, result.sponsored ? "#b45309" : providerColor)}
        <div class="row">
          <span class="chip">score ${esc(String(result.score))}</span>
          <span class="chip" style="background:${providerColor}22;color:${providerColor}">${esc(result.provider)}</span>
          ${result.sponsored ? `<span class="chip sponsored">sponsored · penalized</span>` : `<span class="chip good">organic</span>`}
          ${(result.consensus_count || 0) > 1 ? `<span class="chip agreed">${esc(String(result.consensus_count))} agreed</span>` : ""}
        </div>
        <div class="snippet"><em>${esc(result.rationale || "")}</em></div>
      </div>`;
    });

    html += `</div>`;
  }

  out.innerHTML = html;
}

function scoreBar(score, color) {
  const pct = Math.max(0, Math.round((score / _maxScore) * 100));
  return `<div class="score-bar-wrap">
    <div class="score-bar-label"><span>Score</span><span>${esc(String(score))}</span></div>
    <div class="score-bar-track">
      <div class="score-bar-fill" style="width:${pct}%;background:${color}"></div>
    </div>
  </div>`;
}

function render3D(results) {
  const winnerTitle = results[0].title;
  const xs = results.map((r) => (r.axis_scores || {}).P1_price || 0.5);
  const ys = results.map((r) => (r.axis_scores || {}).P2_distance || 0.5);
  const zs = results.map((r) => (r.axis_scores || {}).P3_rating || 0.5);
  const colors = results.map((r) => r.title === winnerTitle ? "#dc2626" : r.sponsored ? "#b45309" : (PROVIDER_COLORS[r.provider] || "#6aa9ff"));
  const sizes = results.map((r) => r.title === winnerTitle ? 16 : 10);
  const symbols = results.map((r) => r.title === winnerTitle ? "diamond" : r.sponsored ? "x" : "circle");
  const labels = results.map((r, i) => r.title === winnerTitle ? `Winner: ${r.title}` : `#${i + 1}: ${r.title}`);

  const lineTraces = results.map((r, i) => ({
    x: [0, xs[i]],
    y: [0, ys[i]],
    z: [0, zs[i]],
    mode: "lines",
    type: "scatter3d",
    line: { color: colors[i], width: r.title === winnerTitle ? 6 : r.sponsored ? 2 : 3, dash: r.sponsored ? "dot" : "solid" },
    opacity: r.title === winnerTitle ? 0.9 : r.sponsored ? 0.3 : 0.45,
    hoverinfo: "skip",
    showlegend: false,
  }));

  const pointTrace = {
    x: xs,
    y: ys,
    z: zs,
    text: labels,
    mode: "markers+text",
    type: "scatter3d",
    textposition: "top center",
    textfont: { size: 11, color: "#e8ecf5" },
    customdata: results.map((r) => [
      r.title,
      r.provider,
      r.score,
      (r.axis_scores || {}).P1_price || "-",
      (r.axis_scores || {}).P2_distance || "-",
      (r.axis_scores || {}).P3_rating || "-",
      r.sponsored ? "sponsored - penalty applied" : "organic",
    ]),
    hovertemplate:
      "<b>%{customdata[0]}</b><br>" +
      "Provider: %{customdata[1]}<br>" +
      "Score: %{customdata[2]}<br>" +
      "P1 price: %{customdata[3]}<br>" +
      "P2 distance: %{customdata[4]}<br>" +
      "P3 rating: %{customdata[5]}<br>" +
      "<i>%{customdata[6]}</i><extra></extra>",
    marker: { size: sizes, color: colors, symbol: symbols, opacity: 0.95, line: { color: "#ffffff", width: 1.5 } },
    showlegend: false,
  };

  const originTrace = {
    x: [0],
    y: [0],
    z: [0],
    text: ["Query origin"],
    mode: "markers+text",
    type: "scatter3d",
    textposition: "bottom center",
    textfont: { size: 12, color: "#93a0b8" },
    marker: { size: 12, color: "#e8ecf5", symbol: "diamond", line: { color: "#6aa9ff", width: 2 } },
    hovertemplate: "<b>Query origin</b><extra></extra>",
    showlegend: false,
  };

  const layout = {
    margin: { l: 0, r: 0, b: 0, t: 40 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#93a0b8", size: 12 },
    scene: {
      xaxis: { title: "P1 Price score", range: [0, 1] },
      yaxis: { title: "P2 Distance score", range: [0, 1] },
      zaxis: { title: "P3 Rating score", range: [0, 1] },
      camera: { eye: { x: 1.6, y: 1.4, z: 1.2 } },
      aspectmode: "cube",
    },
    showlegend: false,
  };

  const el = document.getElementById("plot-3d");
  el._layout = layout;
  Plotly.newPlot("plot-3d", [...lineTraces, pointTrace, originTrace], layout, { responsive: true, displayModeBar: false });
}

function renderRadar(top3) {
  const axes = ["P1 Price", "P2 Distance", "P3 Rating"];
  const keys = ["P1_price", "P2_distance", "P3_rating"];

  const traces = top3.map((result, index) => {
    const values = keys.map((key) => (result.axis_scores || {})[key] || 0);
    values.push(values[0]);
    const color = index === 0 ? "#dc2626" : (PROVIDER_COLORS[result.provider] || "#6aa9ff");

    return {
      type: "scatterpolar",
      r: values,
      theta: [...axes, axes[0]],
      fill: "toself",
      fillcolor: color + "30",
      line: { color, width: 2 },
      name: result.title.length > 20 ? result.title.slice(0, 18) + "..." : result.title,
      hovertemplate: `<b>${esc(result.title)}</b><br>%{theta}: %{r:.2f}<extra></extra>`,
    };
  });

  Plotly.newPlot("plot-radar", traces, {
    polar: {
      bgcolor: "rgba(0,0,0,0)",
      radialaxis: { visible: true, range: [0, 1], color: "#93a0b8" },
      angularaxis: { color: "#93a0b8" },
    },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#93a0b8" },
    showlegend: true,
  }, { responsive: true, displayModeBar: false });
}

function switchTab(name, tabEl) {
  document.querySelectorAll(".viz-tab").forEach((tab) => tab.classList.remove("active"));
  document.querySelectorAll(".viz-panel").forEach((panel) => panel.classList.remove("active"));
  tabEl.classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
  if (!window.Plotly) return;
  if (name === "3d") Plotly.Plots.resize("plot-3d");
  if (name === "radar") Plotly.Plots.resize("plot-radar");
}

function toggleOthers(btnEl) {
  const el = document.getElementById("others");
  if (!el) return;
  const open = el.classList.toggle("open");
  const count = el.querySelectorAll(".card").length;
  btnEl.textContent = open ? `Hide other responses (${count})` : `Show other responses (${count})`;
}

async function toggleHistory() {
  const dropdown = document.getElementById("history-dropdown");
  if (dropdown.classList.contains("open")) {
    dropdown.classList.remove("open");
    return;
  }
  try {
    const res = await fetch("/history");
    const data = await res.json();
    const queries = data.queries || [];
    if (!queries.length) {
      dropdown.innerHTML = `<div class="history-item"><span class="history-item-text" style="color:var(--muted)">No recent queries yet</span></div>`;
    } else {
      dropdown.innerHTML = queries.map((q) => `
        <div class="history-item" onclick="loadHistory(${JSON.stringify(q)})">
          <span class="history-item-text">${esc(q)}</span>
          <span class="history-cache-badge">cached</span>
        </div>`
      ).join("");
    }
    dropdown.classList.add("open");
  } catch (e) {
    console.error("History fetch failed", e);
  }
}

function loadHistory(query) {
  document.getElementById("q").value = query;
  document.getElementById("history-dropdown").classList.remove("open");
  document.getElementById("f").requestSubmit();
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".history-wrap") && !e.target.closest(".toggle-btn")) {
    document.getElementById("history-dropdown").classList.remove("open");
  }
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
